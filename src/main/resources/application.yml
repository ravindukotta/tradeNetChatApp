spring:
  application:
    name: tradenet-chat-application
  datasource:
    url: jdbc:h2:file:${CHAT_DB_PATH:./data/chatdb};AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
  jmx:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    password: ${DEMO_PASSWORD:password123}
